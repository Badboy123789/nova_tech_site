<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Tech — Owner Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #0d1b2e;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-bottom: 10px;
      color: #19a7ff;
    }

    p {
      color: #aebdcc;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #29415d;
      border-radius: 10px;
      background: #081522;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #19a7ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #078ddd;
    }

    #message {
      margin-top: 15px;
      color: #ff6b6b;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Nova Tech</h1>
    <p>Owner Dashboard Login</p>

    <input
      type="password"
      id="password"
      placeholder="Enter owner password"
    >

    <button onclick="login()">Login</button>

    <div id="message"></div>
  </div>

  <script>
    function login() {
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (password === "12345") {
        sessionStorage.setItem("owner", "yes");
        window.location.href = "dashboard.html";
      } else {
        message.textContent = "Incorrect password.";
      }
    }
  </script>

</body>
</html>
